# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề hoặc thực thể cần tìm, ngắn gọn. Không thêm từ chỉ loại nội dung hoặc thời gian như 'tin tức', 'news', 'hôm nay', 'today'; dùng topic và timeframe cho các thông tin đó. Ví dụ: tin AI hôm nay → 'AI'; tin robotics hôm nay → 'robotics'."}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]
  
  # ---------------- Team tools ----------------
  - name: translate
    description: >-
      Dịch một đoạn văn bản TIẾNG ANH sang một hoặc nhiều ngôn ngữ khác trong MỘT lần gọi, trả về bản dịch theo từng mã ngôn ngữ.
      Nếu user KHÔNG nói dịch sang tiếng nào thì mặc định dịch sang tiếng Việt (bỏ trống target_languages hoặc truyền ["vi"]) — KHÔNG hỏi lại.
      DÙNG KHI: user yêu cầu rõ dịch 1 đoạn văn tiếng Anh đã có sẵn (user dán vào, hoặc là kết quả tool trước đó như bài fetch/tweet/paper) sang ngôn ngữ khác.
      Nếu user muốn dịch sang nhiều thứ tiếng, gom tất cả vào target_languages của một lần gọi,
      KHÔNG gọi lặp lại cho từng ngôn ngữ.
      KHÔNG DÙNG KHI: văn bản nguồn không phải tiếng Anh; user chỉ hỏi nghĩa của một từ
      (trả lời trực tiếp); chưa có văn bản để dịch (vd "dịch bài này" mà không có nội dung/URL)
      → gọi clarify để xin văn bản. Nếu văn bản nằm ở một URL, gọi fetch trước rồi mới dịch.
      Tool chỉ dịch, KHÔNG gửi đi đâu; muốn đăng bản dịch phải qua send và xin xác nhận.
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: >-
            Nguyên văn đoạn tiếng Anh cần dịch, copy đầy đủ, không tự tóm tắt hay sửa nội dung.
            Không đưa câu lệnh của user ("dịch giúp mình...") vào đây.
        target_languages:
          type: array
          default: ["vi"]
          items:
            type: string
            enum: [vi, zh, ja, ko, fr, de, es, ru, th, lo, km, id]
          description: >-
            Danh sách mã ngôn ngữ đích (ISO 639-1), không trùng lặp, không chứa "en".
            User không nói tiếng nào → bỏ trống hoặc ["vi"] (mặc định tiếng Việt).
            Map tên → mã: Việt=vi, Trung=zh, Nhật=ja, Hàn=ko, Pháp=fr, Đức=de,
            Tây Ban Nha=es, Nga=ru, Thái=th, Lào=lo, Khmer/Campuchia=km, Indonesia=id.
            Ví dụ "dịch sang tiếng Nhật và tiếng Hàn" → ["ja", "ko"]; "dịch đoạn này" → ["vi"].
        tone:
          type: string
          enum: [neutral, formal, casual]
          default: "neutral"
          description: >-
            Văn phong bản dịch. formal nếu user nói "trang trọng"/"lịch sự"/văn bản công việc;
            casual nếu user nói "thân mật"/"tự nhiên"/mạng xã hội; còn lại để neutral.
      required: [text]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: summarize
    description: "Tóm tắt đoạn văn bản thô, trích xuất các ý chính ngắn gọn. Dùng khi người dùng yêu cầu tóm tắt văn bản, bài viết hoặc tài liệu."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Đoạn văn bản cần tóm tắt"}
        max_sentences: {type: integer, default: 3, description: "Số câu tối đa cần rút gọn"}
        focus: {type: string, default: "general", description: "Chủ đề trọng tâm cần tập trung trích xuất"}
      required: [text]
